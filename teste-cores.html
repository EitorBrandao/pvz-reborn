<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de cores 4</title>
<!-- Página temporária: mede como o Samsung Internet muda as cores das imagens,
     pra montar um filtro que desfaz a mudança com precisão. -->
<style>
  body { margin: 0; padding: 12px; font: 14px "Trebuchet MS", sans-serif; color: #fff; background: #3d9a22; }
  h1 { font-size: 1.1rem; margin: 0 0 6px; }
  p { margin: 0 0 10px; font-size: .8rem; }
  img { display: block; width: 360px; height: 120px; image-rendering: pixelated; }
  #info { font-size: .7rem; opacity: .9; word-break: break-all; margin-top: 10px; }
</style>
</head>
<body>
<h1>Teste de cores 4 (medição)</h1>
<p>Só tire um print desta tela, sem dar zoom, e me mande.</p>
<img id="amostra" alt="">
<div id="info"></div>
<script>
// 2 fileiras de 9 quadrados (40x40 cada, em tamanho de tela). Fileira 1: cinzas. Fileira 2: cores do jogo.
const CORES = [
  [[0, 0, 0], [32, 32, 32], [64, 64, 64], [96, 96, 96], [128, 128, 128], [160, 160, 160], [192, 192, 192], [224, 224, 224], [255, 255, 255]],
  [[232, 57, 43], [76, 175, 46], [58, 158, 230], [255, 210, 58], [155, 91, 209], [246, 231, 193], [43, 29, 20], [255, 122, 138], [138, 90, 43]],
];
const c = document.createElement('canvas');
c.width = 360; c.height = 120;
const x = c.getContext('2d');
x.fillStyle = '#ff00ff'; x.fillRect(0, 0, 360, 120);
CORES.forEach((linha, j) => linha.forEach(([r, g, b], i) => {
  x.fillStyle = `rgb(${r},${g},${b})`;
  x.fillRect(i * 40, j * 40, 40, 40);
}));
// faixa de referência transparente embaixo (pra ver o que ele faz com transparência)
x.clearRect(0, 80, 360, 40);
x.fillStyle = 'rgba(232,57,43,.5)'; x.fillRect(0, 80, 120, 40);
x.fillStyle = 'rgba(0,0,0,.5)'; x.fillRect(120, 80, 120, 40);
document.getElementById('amostra').src = c.toDataURL('image/png');
document.getElementById('info').textContent = `${window.devicePixelRatio} · ${navigator.userAgent}`;
</script>
</body>
</html>
