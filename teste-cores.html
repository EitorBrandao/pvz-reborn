<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de cores 5</title>
<!-- Página temporária: a arte como fonte colorida (igual emoji) escapa do modo escuro do Samsung? -->
<style>
  @font-face { font-family: HortaArteTeste; src: url('art/teste-cor.woff2') format('woff2'); font-display: block; }
  body { margin: 0; padding: 12px; font: 14px "Trebuchet MS", sans-serif; color: #fff; background: #3d9a22; }
  h1 { font-size: 1.1rem; margin: 0 0 6px; }
  h2 { font-size: .95rem; margin: 14px 0 6px; }
  p { margin: 0 0 8px; font-size: .8rem; }
  .linha { display: flex; gap: 8px; align-items: center; }
  .c { background: #f6e7c1; color: #23301b; border: 3px solid #8a5a2b; border-radius: 12px; padding: 6px; text-align: center; flex: 1; }
  .c small { display: block; font-size: .65rem; }
  .fonte { display: block; font-family: HortaArteTeste; font-size: 54px; line-height: 1.35; color: #000; }
  .c img { width: 72px; height: 72px; }
  canvas { width: 100%; height: 110px; border-radius: 12px; display: block; }
</style>
</head>
<body>
<h1>Teste de cores 5 (fonte colorida)</h1>
<p>Mande um print com o modo escuro <b>ligado</b> e outro <b>desligado</b>. Quero saber se a fileira "fonte" fica igual nos dois.</p>
<h2>Fonte colorida (nova ideia)</h2>
<div class="linha">
  <div class="c"><span class="fonte">&#xE000;</span><small>fonte</small></div>
  <div class="c"><span class="fonte">&#xE001;</span><small>fonte</small></div>
  <div class="c"><span class="fonte">&#xE002;</span><small>fonte</small></div>
</div>
<h2>Imagem (como está hoje no jogo, sem filtro)</h2>
<div class="linha" id="imgs"></div>
<h2>Fonte colorida desenhada na batalha (canvas)</h2>
<canvas id="cv"></canvas>
<script type="module">
import { urlArte } from './js/arte.js';
document.getElementById('imgs').innerHTML = ['pimentao', 'cacto', 'milho']
  .map((id) => `<div class="c"><img src="${urlArte('u', id)}" alt=""><small>imagem</small></div>`).join('');
await document.fonts.load('58px HortaArteTeste');
const cv = document.getElementById('cv');
const dpr = window.devicePixelRatio || 1;
cv.width = cv.clientWidth * dpr;
cv.height = 110 * dpr;
const x = cv.getContext('2d');
x.scale(dpr, dpr);
const w = cv.clientWidth;
for (let i = 0; i < 8; i++) for (let j = 0; j < 3; j++) {
  x.fillStyle = (i + j) % 2 ? '#4caf2e' : '#43a326';
  x.fillRect(i * w / 8, j * w / 8, w / 8 + 1, w / 8 + 1);
}
x.font = '58px HortaArteTeste';
x.textBaseline = 'middle';
x.fillStyle = '#000';
x.fillText('  ', 10, 55);
</script>
</body>
</html>
